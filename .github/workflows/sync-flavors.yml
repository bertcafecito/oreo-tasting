name: Sync Oreo Flavors Markdown

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout tasting repository
        uses: actions/checkout@v4

      - name: Download master flavor list
        run: |
          curl -L \
            https://raw.githubusercontent.com/bertcafecito/oreo-flavors/main/flavors.md \
            -o flavors.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet flavors.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated flavor list
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flavors.json
          git commit -m "Sync Oreo flavor catalog"
          git push